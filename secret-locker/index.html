<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Secret Locker</title>
<style>
  :root { --sfondo: #101418; --testo: #eef1f4; --tenue: #8b96a1; --tasto: #1e252c; --tasto-su: #2c353e; --accento: #e0a43a; --errore: #e05a4f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--sfondo); color: var(--testo); font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .schermo { min-height: 100%; max-width: 420px; margin: 0 auto; padding: 48px 16px 24px; display: flex; flex-direction: column; align-items: center; }
  .icona { width: 64px; height: 64px; border-radius: 16px; background: linear-gradient(145deg, #3a2d16, #6b4d1c); display: grid; place-items: center; font-size: 32px; }
  h1 { font-size: 20px; font-weight: 600; margin: 14px 0 4px; }
  .sotto { color: var(--tenue); font-size: 14px; margin: 0 0 28px; text-align: center; min-height: 20px; }
  .sotto.errore { color: var(--errore); }
  #pin { display: flex; flex-direction: column; align-items: center; }
  .punti { display: flex; gap: 16px; margin-bottom: 36px; }
  .punti i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--tenue); }
  .punti i.pieno { background: var(--testo); border-color: var(--testo); }
  .scossa { animation: scossa .35s; }
  @keyframes scossa { 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
  .tastiera { display: grid; grid-template-columns: repeat(3, 76px); gap: 16px 26px; }
  .tastiera button { width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--tasto); color: var(--testo); font-size: 28px; cursor: pointer; }
  .tastiera button:active { background: var(--tasto-su); }
  .tastiera button:disabled { opacity: .35; }
  .tastiera .vuoto { visibility: hidden; }
  .tastiera .canc { background: none; font-size: 18px; color: var(--tenue); }
  .link { margin-top: 32px; background: none; border: 0; color: var(--accento); font-size: 14px; cursor: pointer; }
  .domanda { display: none; width: 100%; margin-top: 8px; }
  .domanda label { display: block; font-size: 15px; margin-bottom: 10px; text-align: center; }
  .domanda input { width: 100%; padding: 12px 14px; font-size: 16px; border-radius: 10px; border: 1px solid #2c353e; background: var(--tasto); color: var(--testo); }
  .domanda input:focus { outline: 2px solid var(--accento); border-color: transparent; }
  .domanda button { width: 100%; margin-top: 12px; padding: 12px; font-size: 16px; border: 0; border-radius: 10px; background: var(--accento); color: #1a1408; font-weight: 600; cursor: pointer; }
  .galleria { display: none; max-width: 900px; margin: 0 auto; padding: 24px 16px; }
  .galleria h2 { font-size: 18px; font-weight: 600; margin: 0 0 16px; }
  .griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  figure { margin: 0; cursor: zoom-in; }
  figure img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 6px; display: block; }
  figcaption { font-size: 12px; color: var(--tenue); margin-top: 4px; display: flex; justify-content: space-between; }
  .lente { position: fixed; inset: 0; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
  .lente img { max-width: 100%; max-height: 100%; }
</style>
</head>
<body>
<div class="schermo" id="blocco">
  <div class="icona">🔒</div>
  <h1>Secret Locker</h1>
  <p class="sotto" id="msg">Inserisci il PIN</p>
  <div id="pin">
    <div class="punti" id="punti"></div>
    <div class="tastiera" id="tastiera"></div>
  </div>
  <form class="domanda" id="domanda">
    <label for="risposta">Il nome del tuo animale preferito</label>
    <input id="risposta" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit">Accedi</button>
  </form>
  <button class="link" id="cambia">Accedi con altro metodo</button>
</div>
<div class="galleria" id="galleria"><h2>Secret Locker</h2><div id="contenuto"></div></div>

const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const pulisci = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
let pin = "", errori = 0;

$("punti").innerHTML = "<i></i>".repeat(CIFRE);
["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(t => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = t;
  if (!t) b.className = "vuoto";
  if (t === "⌫") b.className = "canc";
  b.onclick = () => premi(t);
  $("tastiera").appendChild(b);
});
document.addEventListener("keydown", e => {
  if ($("pin").style.display === "none") return;
  if (/^[0-9]$/.test(e.key)) premi(e.key);
  if (e.key === "Backspace") premi("⌫");
});

function avviso(testo, errore) {
  $("msg").textContent = testo;
  $("msg").className = errore ? "sotto errore" : "sotto";
}
function scuoti(el) {
  el.classList.add("scossa");
  setTimeout(() => el.classList.remove("scossa"), 350);
}
function disegna() {
  [...$("punti").children].forEach((p, i) => p.classList.toggle("pieno", i < pin.length));
}
function premi(t) {
  if (!t || $("tastiera").dataset.fermo) return;
  pin = t === "⌫" ? pin.slice(0, -1) : (pin + t).slice(0, CIFRE);
  disegna();
  if (pin.length === CIFRE) setTimeout(sbagliato, 150);
}
function sbagliato() {
  errori++;
  scuoti($("punti"));
  setTimeout(() => { pin = ""; disegna(); }, 350);
  if (errori % 5 === 0) ferma(30);
  else avviso("PIN errato", true);
}
function ferma(sec) {
  const tastiera = $("tastiera");
  tastiera.dataset.fermo = "1";
  [...tastiera.children].forEach(b => b.disabled = true);
  const conta = () => {
    avviso(`Troppi tentativi. Riprova fra ${sec} secondi`, true);
    if (sec-- > 0) return setTimeout(conta, 1000);
    delete tastiera.dataset.fermo;
    [...tastiera.children].forEach(b => b.disabled = false);
    avviso("Inserisci il PIN");
  };
  conta();
}

$("cambia").onclick = () => {
  const suPin = $("pin").style.display !== "none";
  $("pin").style.display = suPin ? "none" : "";
  $("domanda").style.display = suPin ? "block" : "none";
  $("cambia").textContent = suPin ? "Accedi con il PIN" : "Accedi con altro metodo";
  avviso(suPin ? "Domanda di sicurezza" : "Inserisci il PIN");
  if (suPin) $("risposta").focus();
};
$("domanda").onsubmit = async e => {
  e.preventDefault();
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pulisci($("risposta").value)), "PBKDF2", false, ["deriveKey"]);
    const chiave = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.sale), iterations: P.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const chiaro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, chiave, b64(P.ct));
    apri(new TextDecoder().decode(chiaro));
  } catch (err) {
    scuoti($("risposta"));
    avviso("Risposta errata", true);
  }
};

function apri(html) {
  $("blocco").style.display = "none";
  $("contenuto").innerHTML = html;
  $("galleria").style.display = "block";
  document.querySelectorAll("figure img").forEach(img => img.onclick = () => {
    $("lente").querySelector("img").src = img.src;
    $("lente").style.display = "flex";
  });
}
$("lente").onclick = () => $("lente").style.display = "none";
</script>
